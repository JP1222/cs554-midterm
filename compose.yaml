name: cs554-midterm
services:
  app:
    image: cs554-midterm:1.0.0
    build: .
    environment:
      PORT: "8080"
      SERVICE_NAME: cs554-midterm
      MESSAGE: "Hello from the midterm service"
      READINESS_BLOCK_FILE: /tmp/midterm-not-ready
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - midterm
networks:
  midterm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.54.0/24
