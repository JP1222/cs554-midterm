apiVersion: v1
kind: Pod
metadata:
  name: evidence-client
  namespace: cs554-midterm
  labels:
    role: evidence-client
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: cs554-midterm:1.0.0
      imagePullPolicy: Never
      command: ["node", "-e", "setInterval(()=>{}, 3600000)"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
