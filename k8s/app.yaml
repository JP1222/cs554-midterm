apiVersion: v1
kind: Namespace
metadata:
  name: cs554-midterm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: midterm-app
  namespace: cs554-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: midterm-app
  template:
    metadata:
      labels:
        app: midterm-app
    spec:
      containers:
        - name: app
          image: cs554-midterm:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: cs554-midterm
            - name: MESSAGE
              value: "Hello from the midterm service"
            - name: READINESS_BLOCK_FILE
              value: /tmp/midterm-not-ready
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: midterm-app
  namespace: cs554-midterm
spec:
  type: ClusterIP
  selector:
    app: midterm-app
  ports:
    - name: http
      port: 80
      targetPort: http
